[General]
# Path to desktop wallpaper image (JPEG format)
wallpaper = /usr/share/artwork/wallpaper.jpg

# Default terminal emulator command
terminal = /usr/bin/szponterm

# Enable floating bottom dock
dock_enabled = true

# Panel position: top or bottom
panel_position = top

# Panel height in pixels
panel_height = 32

# Pinned applications on dock (comma-separated desktop file names or commands)
dock_pinned = szponter,szponterm,szpontview,szpontmon,fastfetch

# Applications to autostart upon session initialization (comma-separated commands)
autostart = 

# Window decoration corner radius in pixels (XShape)
window_radius = 8

# Window frame border width
border_width = 1
