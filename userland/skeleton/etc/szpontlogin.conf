[General]
# Graphical desktop session binary to execute upon successful authentication
session_command = /usr/bin/szpontdesktop

# Friendly name of the desktop session
session_name = Szpont Experience

# Default username selected when the login screen opens
default_user = szpont

# Allow system administrator (root) to log in via graphical display manager
allow_root = true

# Minimum UID for regular user accounts to show in the user list
min_uid = 1000

# Title displayed on the login card
title = SZPONT EXPERIENCE
