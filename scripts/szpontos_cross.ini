[binaries]
c = '@ROOT_DIR@/scripts/szpontos-gcc'
cpp = 'x86_64-elf-g++'
ar = 'x86_64-elf-ar'
ranlib = 'x86_64-elf-ranlib'
strip = 'x86_64-elf-strip'
pkg-config = 'pkg-config'

[properties]
needs_exe_wrapper = true
sys_root = '@SYSROOT_DIR@'
pkg_config_libdir = '@SYSROOT_DIR@/usr/lib/pkgconfig:@SYSROOT_DIR@/usr/share/pkgconfig'

[built-in options]
c_args = ['-O2', '-ffreestanding', '-fno-builtin', '-isystem', '@SYSROOT_DIR@/usr/include', '-B@SYSROOT_DIR@/usr/lib', '-D__szpontos__=1', '-D__linux__=1', '-D_GNU_SOURCE=1']
c_link_args = ['-L@SYSROOT_DIR@/usr/lib', '-B@SYSROOT_DIR@/usr/lib', '-Wl,-rpath-link,@SYSROOT_DIR@/usr/lib', '-lc', '-lm', '-lz']

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
